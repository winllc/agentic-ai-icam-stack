# Agentic AI ICAM demo stack
#
#   User ─► Agentic AI Service ─(OIDC+PKCE)─► PingFederate
#             │ task + user token
#             ▼
#           Agent Runtime ─► Agent Instance ─(Workload API)─► SPIRE Agent ─► SPIRE Server
#                                 │  X.509-SVID
#                                 ├─(Token Exchange + mTLS)─► PingFederate ─► delegated token
#                                 ├─(mTLS + bound token)───► Enterprise Resources (REST API, MCP server)
#                                 └─(identity chaining)────► partner.example: Partner AS ─► Partner API
#                                    JWT grant from PingFederate, redeemed over SPIFFE-federated mTLS
#
#   LDAP directory (people + agent NPEs) ─► directory-sync ─► SPIRE entries + effective IdP policy
#   Enterprise root CA ─► SPIRE issuing CA (key in Vault) ─► SPIRE CA ─► SVIDs   (one trust anchor)
#   Vault: SPIRE's upstream CA + dynamic database users for agents (delegated-token login)
#
# `docker compose up --build` then open http://localhost:8080 (alice/alice or bob/bob).
# Behind real DNS / a reverse proxy: set PORTAL_PUBLIC_URL and PF_PUBLIC_URL in .env (see README).

name: agentic-icam

x-spire-version: &spire-version ${SPIRE_VERSION:-1.13.3}

x-python-service: &python-service
  build: ./services
  image: agentic-icam/services:latest
  restart: unless-stopped
  depends_on:
    spire-agent:
      condition: service_healthy
  volumes:
    - spire-agent-socket:/run/spire/sockets:ro

x-ldap-idp-env: &ldap-idp-env
  LDAP_URL: ldap://ldap:389
  LDAP_BIND_DN: cn=idp,ou=services,dc=demo,dc=local
  LDAP_BIND_PASSWORD: ${LDAP_IDP_PASSWORD:-idp-secret}

x-python-env: &python-env
  SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
  # Browser-facing issuer (PF_PUBLIC_URL) vs. the name containers use to reach the AS.
  PF_ISSUER: ${PF_PUBLIC_URL:-http://localhost:9031}
  PF_INTERNAL_BASE: http://pingfederate:9031
  PF_JWKS_URL: http://pingfederate:9031/pf/JWKS
  PF_DISCOVERY_URL: http://pingfederate:9031/.well-known/openid-configuration
  NO_PROXY: pingfederate,systems-api,ops-mcp,analysis-agent,remediation-agent,localhost
  no_proxy: pingfederate,systems-api,ops-mcp,analysis-agent,remediation-agent,localhost

x-tcp-health: &tcp-health
  test: ["CMD", "python", "-c", "import os, socket; socket.create_connection(('localhost', int(os.environ['HEALTH_PORT'])), 2)"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 5s

x-healthcheck: &http-health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 5s

services:
  # ------------------------------------------------------------------ SPIRE
  pki-init:
    build:
      context: ./spire/tools
      args:
        SPIRE_VERSION: *spire-version
    image: agentic-icam/spire-tools:latest
    command: ["pki-init.sh"]
    environment:
      # PingFederate's HTTPS certificate also names the public host (for proxies that pass TLS through).
      PF_PUBLIC_URL: ${PF_PUBLIC_URL:-https://localhost:9031}
      PF_TLS_EXTRA_SANS: ${PF_TLS_EXTRA_SANS:-}
    volumes:
      - spire-pki:/pki
      - spire-server-data:/spire-server-data
      - spire-server-socket:/spire-server-socket
      - partner-server-data:/partner-server-data
      - partner-server-socket:/partner-server-socket

  # ------------------------------------------------------------------ Vault
  vault:
    image: hashicorp/vault:${VAULT_VERSION:-1.20}
    command: ["server"]
    restart: unless-stopped
    depends_on:
      pki-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /pki/tls/trust-anchor.pem
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - spire-pki:/pki:ro
      - vault-data:/vault/file
    ports:
      - "8200:8200"     # UI/API (TLS, enterprise root)
    healthcheck:       # reachable (sealed or not); vault-init unseals it
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      <<: *http-health

  # Init/unseal + the SPIRE issuing CA inside Vault + SPIRE's AppRole (before SPIRE starts).
  vault-init:
    image: agentic-icam/services:latest
    command: ["python", "-m", "icam.vaultsetup.setup", "pki"]
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_APPROLE_SECRET_ID: ${VAULT_APPROLE_SECRET_ID:-spire-approle-secret-demo}
    volumes:
      - spire-pki:/pki:ro
      - vault-keys:/vault-keys

  spire-server:
    image: ghcr.io/spiffe/spire-server:${SPIRE_VERSION:-1.13.3}
    command: ["-config", "/opt/spire/conf/server/server.conf", "-expandEnv"]
    restart: unless-stopped
    depends_on:
      pki-init:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_APPROLE_SECRET_ID: ${VAULT_APPROLE_SECRET_ID:-spire-approle-secret-demo}
    volumes:
      - ./spire/server/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-pki:/opt/spire/pki:ro
      - spire-server-data:/var/lib/spire/server/data
      - spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      <<: *http-health

  # The external partner's SPIRE Server (trust domain partner.example), federated with ours.
  spire-server-partner:
    image: ghcr.io/spiffe/spire-server:${SPIRE_VERSION:-1.13.3}
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    restart: unless-stopped
    depends_on:
      pki-init:
        condition: service_completed_successfully
    volumes:
      - ./spire/partner/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-pki:/opt/spire/pki:ro
      - partner-server-data:/var/lib/spire/server/data
      - partner-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      <<: *http-health

  spire-register:
    image: agentic-icam/spire-tools:latest
    command: ["register.sh"]
    depends_on:
      pki-init:
        condition: service_completed_successfully
      spire-server:
        condition: service_healthy
      spire-server-partner:
        condition: service_healthy
    volumes:
      - spire-pki:/pki
      - spire-server-socket:/tmp/spire-server/private
      - partner-server-socket:/tmp/spire-server-partner/private

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:${SPIRE_VERSION:-1.13.3}
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    restart: unless-stopped
    user: "0"
    # The docker WorkloadAttestor resolves caller PIDs to containers, so it needs
    # the host PID + cgroup namespaces and read access to the Docker API.
    pid: host
    cgroup: host
    depends_on:
      spire-register:
        condition: service_completed_successfully
    volumes:
      - ./spire/agent/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-pki:/opt/spire/pki:ro
      - spire-agent-socket:/run/spire/sockets
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      <<: *http-health

  spire-agent-partner:
    image: ghcr.io/spiffe/spire-agent:${SPIRE_VERSION:-1.13.3}
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    restart: unless-stopped
    user: "0"
    pid: host
    cgroup: host
    depends_on:
      spire-register:
        condition: service_completed_successfully
    volumes:
      - ./spire/partner/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-pki:/opt/spire/pki:ro
      - partner-agent-socket:/run/spire/sockets
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      <<: *http-health

  # ------------------------------------------------------------------ Directory (system of record)
  ldap:
    build: ./directory
    image: agentic-icam/ldap:latest
    restart: unless-stopped
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
      LDAP_SYNC_PASSWORD: ${LDAP_SYNC_PASSWORD:-sync-secret}
      LDAP_IDP_PASSWORD: ${LDAP_IDP_PASSWORD:-idp-secret}
    volumes:
      - ldap-data:/var/lib/openldap/data
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost", "-D", "cn=idp,ou=services,dc=demo,dc=local",
             "-w", "${LDAP_IDP_PASSWORD:-idp-secret}"]
      <<: *http-health

  # Directory -> runtime: SPIRE registration entries for agents + the effective IdP policy.
  directory-sync:
    build:
      context: ./services
      dockerfile: sync.Dockerfile
    image: agentic-icam/directory-sync:latest
    command: ["python", "-m", "icam.directory.sync"]
    restart: unless-stopped
    depends_on:
      ldap:
        condition: service_healthy
      spire-register:
        condition: service_completed_successfully
    environment:
      LDAP_URL: ldap://ldap:389
      LDAP_BIND_DN: cn=directory-sync,ou=services,dc=demo,dc=local
      LDAP_BIND_PASSWORD: ${LDAP_SYNC_PASSWORD:-sync-secret}
      BASE_POLICY: /config/idp-policy.yaml
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8080}   # fills ${PORTAL_PUBLIC_URL} in the policy (redirect URI)
      EFFECTIVE_POLICY: /policy/effective-policy.yaml
      SYNC_INTERVAL: "10"
    volumes:
      - ./config/idp-policy.yaml:/config/idp-policy.yaml:ro
      - ./config/directory-mapping.yaml:/config/directory-mapping.yaml:ro
      - policy:/policy
      - spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "test", "-f", "/policy/.synced"]
      <<: *http-health

  # ------------------------------------------------------------------ Identity provider
  pingfederate:
    <<: *python-service
    command: ["python", "-m", "icam.idp.app"]
    labels:
      ai.demo.spiffe-workload: pingfederate
    depends_on:
      spire-agent:
        condition: service_healthy
      directory-sync:
        condition: service_healthy
    environment:
      <<: [*python-env, *ldap-idp-env]
      PF_POLICY: /policy/effective-policy.yaml
      PF_MTLS_BASE: https://pingfederate:9443
      DEMO_EXPLAIN: "true"
    volumes:
      - spire-agent-socket:/run/spire/sockets:ro
      - policy:/policy:ro
      - ./config/directory-mapping.yaml:/config/directory-mapping.yaml:ro
    ports:
      - "9031:9031"   # browser + back channel
      - "9443:9443"   # mTLS token endpoint alias
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9031/healthz')"]
      <<: *http-health

  # ------------------------------------------------------------------ Legacy system + Vault brokers
  inventory-db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_SUPERUSER_PASSWORD:-postgres-demo}
    volumes:
      - ./inventory-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "inventory"]
      <<: *http-health

  # JWT auth trusting the IdP + PostgreSQL dynamic credentials + audit (after the IdP is up).
  vault-config:
    image: agentic-icam/services:latest
    command: ["python", "-m", "icam.vaultsetup.setup", "brokers"]
    depends_on:
      vault-init:
        condition: service_completed_successfully
      inventory-db:
        condition: service_healthy
      pingfederate:
        condition: service_healthy
    environment:
      IDP_JWKS_URL: http://pingfederate:9031/pf/JWKS
      IDP_ISSUER: ${PF_PUBLIC_URL:-http://localhost:9031}
    volumes:
      - spire-pki:/pki:ro
      - vault-keys:/vault-keys:ro

  # ------------------------------------------------------------------ Agentic AI Service
  agentic-ai-service:
    <<: *python-service
    command: ["python", "-m", "icam.portal.app"]
    environment:
      <<: *python-env
      HEALTH_PORT: "8080"
      OIDC_CLIENT_ID: agentic-ai-portal
      OIDC_CLIENT_SECRET: portal-secret
      PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8080}          # redirect URI = PUBLIC_URL/callback
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}   # honor X-Forwarded-* from this many proxies
      PORTAL_SESSION_KEY: ${PORTAL_SESSION_KEY:-}
      EFFECTIVE_POLICY: /policy/effective-policy.yaml
    depends_on:
      pingfederate:
        condition: service_healthy
    volumes:
      - policy:/policy:ro
    ports:
      - "8080:8080"
    healthcheck: *tcp-health

  # ------------------------------------------------------------------ Agent runtimes
  analysis-agent:
    <<: *python-service
    command: ["python", "-m", "icam.agent.runtime"]
    labels:
      ai.demo.spiffe-workload: analysis-agent
    environment:
      <<: *python-env
      HEALTH_PORT: "8090"
      AGENT_NAME: analysis-agent
      AGENT_POLICY: /policy/effective-policy.yaml
      SYSTEMS_API_URL: https://systems-api:8443
      OPS_MCP_URL: https://ops-mcp:8443/mcp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    depends_on:
      spire-agent:
        condition: service_healthy
      directory-sync:
        condition: service_healthy
      vault-config:
        condition: service_completed_successfully
    volumes:
      - spire-agent-socket:/run/spire/sockets:ro
      - policy:/policy:ro
    healthcheck: *tcp-health

  remediation-agent:
    <<: *python-service
    command: ["python", "-m", "icam.agent.runtime"]
    labels:
      ai.demo.spiffe-workload: remediation-agent
    environment:
      <<: *python-env
      HEALTH_PORT: "8090"
      AGENT_NAME: remediation-agent
      AGENT_POLICY: /policy/effective-policy.yaml
      SYSTEMS_API_URL: https://systems-api:8443
      OPS_MCP_URL: https://ops-mcp:8443/mcp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    depends_on:
      spire-agent:
        condition: service_healthy
      directory-sync:
        condition: service_healthy
      vault-config:
        condition: service_completed_successfully
    volumes:
      - spire-agent-socket:/run/spire/sockets:ro
      - policy:/policy:ro
    healthcheck: *tcp-health

  # ------------------------------------------------------------------ Enterprise resources
  systems-api:
    <<: *python-service
    command: ["python", "-m", "icam.resources.systems_api"]
    labels:
      ai.demo.spiffe-workload: systems-api
    environment:
      <<: *python-env
      HEALTH_PORT: "8443"
      RESOURCE_URI: https://systems-api:8443
    healthcheck: *tcp-health

  ops-mcp:
    <<: *python-service
    command: ["python", "-m", "icam.resources.ops_mcp"]
    labels:
      ai.demo.spiffe-workload: ops-mcp
    environment:
      <<: *python-env
      HEALTH_PORT: "8443"
      RESOURCE_URI: https://ops-mcp:8443/mcp
    healthcheck: *tcp-health

  # ------------------------------------------------------------------ External partner (partner.example)
  partner-as:
    <<: *python-service
    command: ["python", "-m", "icam.partner.authz"]
    labels:
      example.partner.spiffe-workload: partner-as
    depends_on:
      spire-agent-partner:
        condition: service_healthy
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
      PARTNER_POLICY: /config/partner-policy.yaml
      # demo.local's assertion issuer (the PingFederate simulator in this mode)
      ORIGIN_ISSUER: ${PF_PUBLIC_URL:-http://localhost:9031}
      ORIGIN_JWKS_URL: http://pingfederate:9031/pf/JWKS
      HEALTH_PORT: "8443"
    volumes:
      - partner-agent-socket:/run/spire/sockets:ro
      - ./config/partner-policy.yaml:/config/partner-policy.yaml:ro
    healthcheck: *tcp-health

  partner-api:
    <<: *python-service
    command: ["python", "-m", "icam.partner.api"]
    labels:
      example.partner.spiffe-workload: partner-api
    depends_on:
      spire-agent-partner:
        condition: service_healthy
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
      # Only the partner's own AS is trusted here - never demo.local's tokens.
      PF_ISSUER: https://partner-as:8443
      PF_JWKS_URL: https://partner-as:8443/jwks
      PF_TLS_CA: /run/svid/bundle.pem
      RESOURCE_URI: https://partner-api:8443
      HEALTH_PORT: "8443"
    volumes:
      - partner-agent-socket:/run/spire/sockets:ro
    healthcheck: *tcp-health

volumes:
  spire-pki:
  spire-server-data:
  spire-server-socket:
  spire-agent-socket:
  partner-server-data:
  partner-server-socket:
  partner-agent-socket:
  ldap-data:
  policy:
  vault-data:
  vault-keys:
  inventory-data:
