include   /etc/openldap/schema/core.schema
include   /etc/openldap/schema/cosine.schema
include   /etc/openldap/schema/inetorgperson.schema
include   /etc/openldap/schema/icam.schema

pidfile   /run/openldap/slapd.pid
argsfile  /run/openldap/slapd.args
modulepath /usr/lib/openldap
moduleload back_mdb.so
loglevel  stats

database  mdb
maxsize   104857600
suffix    "dc=demo,dc=local"
rootdn    "cn=admin,dc=demo,dc=local"
rootpw    @ROOTPW@
directory /var/lib/openldap/data
index     objectClass eq
index     uid,cn eq

# Passwords: verifiable by bind, never readable.
access to attrs=userPassword
  by self =w
  by anonymous auth
  by * none
# Governance data: the sync job and the IdPs read; people read their own entry.
access to *
  by dn.exact="cn=directory-sync,ou=services,dc=demo,dc=local" read
  by dn.exact="cn=idp,ou=services,dc=demo,dc=local" read
  by self read
  by * none
