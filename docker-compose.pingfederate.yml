# Overlay: run a real, licensed PingFederate instead of the simulator.
#
#   cp ~/pingfederate.lic pingfederate/license/pingfederate.lic   # readable by uid 9031
#   docker compose -f docker-compose.yml -f docker-compose.pingfederate.yml up -d --build --wait
#
# pf-configurator applies config/idp-policy.yaml through the admin API (scopes, users,
# OIDC + PKCE client, JWT access token managers, token exchange policy, mTLS agent
# clients) and keeps SPIRE's CA bundle in PingFederate's Trusted CAs.

x-real-pf-env: &real-pf-env
  PF_ISSUER: https://localhost:9031
  PF_INTERNAL_BASE: https://pingfederate:9031
  PF_DISCOVERY_URL: https://pingfederate:9031/.well-known/openid-configuration
  PF_JWKS_URL: https://pingfederate:9031/pf/JWKS
  PF_TLS_CA: /pf-trust/pf-ca.pem          # written by pf-configurator

x-after-configurator: &after-configurator
  spire-agent:
    condition: service_healthy
  pf-configurator:
    condition: service_healthy

services:
  pingfederate:
    image: pingidentity/pingfederate:${PF_IMAGE_TAG:-2609-13.1.3}
    build: !reset null
    command: !reset null
    labels: !reset {}
    depends_on: !reset {}
    restart: unless-stopped
    environment: !override
      PING_IDENTITY_ACCEPT_EULA: "YES"
      PF_ENGINE_SECONDARY_PORT: "9032"        # mTLS listener for tls_client_auth
      PF_ADMIN_PUBLIC_BASEURL: https://localhost:9999
    volumes: !override
      - ./pingfederate/license/pingfederate.lic:/opt/in/instance/server/default/conf/pingfederate.lic:ro
    ports: !override
      - "9031:9031"   # runtime (browser + back channel)
      - "9999:9999"   # admin console / admin API
    healthcheck: !override
      test: ["CMD-SHELL", "curl -skf https://localhost:9031/pf/heartbeat.ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  pf-configurator:
    image: agentic-icam/services:latest
    command: ["python", "-m", "icam.pfconfig.configure"]
    restart: unless-stopped
    labels:
      ai.demo.spiffe-workload: pf-configurator
    depends_on:
      spire-agent:
        condition: service_healthy
      pingfederate:
        condition: service_healthy
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
      PF_ADMIN_URL: https://pingfederate:9999
      PF_ADMIN_USER: ${PF_ADMIN_USER:-administrator}
      PF_ADMIN_PASSWORD: ${PF_ADMIN_PASSWORD:-2FederateM0re}
      PF_ISSUER: https://localhost:9031
      PF_POLICY: /config/idp-policy.yaml
      PF_TRUST_DIR: /pf-trust
      SYNC_INTERVAL: "30"
    volumes:
      - spire-agent-socket:/run/spire/sockets:ro
      - ./config/idp-policy.yaml:/config/idp-policy.yaml:ro
      - pf-trust:/pf-trust
      - spire-pki:/pki:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/pf-trust/ready"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s

  agentic-ai-service:
    environment:
      <<: *real-pf-env
    volumes: !override
      - pf-trust:/pf-trust:ro
    depends_on: !override
      <<: *after-configurator

  analysis-agent: &agent-overrides
    environment:
      <<: *real-pf-env
      PF_MTLS_TOKEN_ENDPOINT: https://pingfederate:9032/as/token.oauth2
    volumes: !override
      - spire-agent-socket:/run/spire/sockets:ro
      - pf-trust:/pf-trust:ro
      - ./config/idp-policy.yaml:/config/idp-policy.yaml:ro
    depends_on: !override
      <<: *after-configurator

  remediation-agent: *agent-overrides

  systems-api: &resource-overrides
    environment:
      <<: *real-pf-env
    volumes: !override
      - spire-agent-socket:/run/spire/sockets:ro
      - pf-trust:/pf-trust:ro
    depends_on: !override
      <<: *after-configurator

  ops-mcp: *resource-overrides

volumes:
  pf-trust:
