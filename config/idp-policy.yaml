# Policy for the PingFederate-compatible demo authorization server.
# The same objects map 1:1 onto PingFederate configuration (see pingfederate/README.md):
#   users            -> Password Credential Validator + attribute contract
#   clients          -> OAuth clients
#   agent ceilings   -> per-client "Restrict scopes" on the token-exchange client
#
# Delegated scope = (scopes in the user's token)
#                 ∩ (scopes the agent client is allowed)
#                 ∩ (scopes the agent requested for this task)

scopes:
  openid:          OpenID Connect sign-in
  profile:         Basic profile
  email:           Email address
  systems:read:    Read system inventory and status
  systems:analyze: Run diagnostics against a system
  metrics:read:    Read telemetry for a system
  tickets:read:    Read incident tickets
  tickets:write:   Open or update incident tickets
  # Egress scopes: may leave demo.local inside a federation grant (see `federation`).
  partner:status.read: Read a partner's service status (external API)
  partner:cases.write: Open support cases with a partner (external API)

users:
  alice:
    password: alice
    name: Alice Rivera
    email: alice@demo.local
    groups: [sre-leads]
    # Alice is entitled to everything, including opening tickets.
    entitlements: [systems:read, systems:analyze, metrics:read, tickets:read, tickets:write,
                   partner:status.read, partner:cases.write]
  bob:
    password: bob
    name: Bob Chen
    email: bob@demo.local
    groups: [analysts]
    # Bob can look (including at partners), but cannot run diagnostics, touch tickets or open cases.
    entitlements: [systems:read, metrics:read, partner:status.read]

clients:
  agentic-ai-portal:
    description: Agentic AI Service (user-facing web app)
    client_secret: portal-secret
    grant_types: [authorization_code]
    require_pkce: true
    redirect_uris: [http://localhost:8080/callback]
    allowed_scopes: [openid, profile, email, systems:read, systems:analyze, metrics:read, tickets:read, tickets:write,
                     partner:status.read, partner:cases.write]
    access_token_audience: agentic-ai-service
    access_token_ttl: 900

  analysis-agent:
    description: Read-only analysis agent
    token_endpoint_auth_method: tls_client_auth            # RFC 8705 mTLS client auth
    tls_client_auth_san_uri: spiffe://demo.local/agent/analysis-agent
    grant_types: [urn:ietf:params:oauth:grant-type:token-exchange]
    allowed_scopes: [systems:read, systems:analyze, metrics:read, tickets:read, partner:status.read]
    allowed_resources: [https://systems-api:8443, https://ops-mcp:8443/mcp, https://partner-as:8443]
    subject_token_audiences: [agentic-ai-service]          # whose user tokens it may exchange
    access_token_ttl: 300

  remediation-agent:
    description: Remediation agent (may open tickets, cannot run diagnostics)
    token_endpoint_auth_method: tls_client_auth
    tls_client_auth_san_uri: spiffe://demo.local/agent/remediation-agent
    grant_types: [urn:ietf:params:oauth:grant-type:token-exchange]
    allowed_scopes: [systems:read, tickets:read, tickets:write, partner:status.read, partner:cases.write]
    allowed_resources: [https://systems-api:8443, https://ops-mcp:8443/mcp, https://partner-as:8443]
    subject_token_audiences: [agentic-ai-service]
    access_token_ttl: 300

# Cross-domain identity chaining (draft-ietf-oauth-identity-chaining): an agent exchanges the
# user's token for a short-lived JWT authorization grant addressed to a partner's AS, then
# redeems it there (RFC 7523 jwt-bearer). Only the scopes listed here may leave demo.local,
# and only for agents whose allowed_resources include the partner AS.
federation:
  partner.example:
    authorization_server: https://partner-as:8443
    scopes: [partner:status.read, partner:cases.write]
    subject: pairwise          # the partner never sees internal user ids
    pairwise_salt: demo-pairwise-salt
    grant_ttl: 60              # seconds; single-use at the partner (jti)
