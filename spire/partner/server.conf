# SPIRE Server for the external partner trust domain (partner.example).
server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    socket_path  = "/tmp/spire-server/private/api.sock"
    trust_domain = "partner.example"
    data_dir     = "/var/lib/spire/server/data"
    log_level    = "INFO"

    ca_ttl                 = "168h"
    default_x509_svid_ttl  = "1h"
    default_jwt_svid_ttl   = "5m"

    # SPIFFE federation: publish our bundle and keep demo.local's bundle current.
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8443
        }
        federates_with "demo.local" {
            bundle_endpoint_url = "https://spire-server:8443"
            bundle_endpoint_profile "https_spiffe" {
                endpoint_spiffe_id = "spiffe://demo.local/spire/server"
            }
        }
    }

    ca_subject {
        country      = ["US"]
        organization = ["Partner Example Corp"]
        common_name  = "Partner SPIRE CA"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/data/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/data/keys.json"
        }
    }

    # Node attestation: the SPIRE Agent proves possession of a key whose
    # certificate chains to the demo "node CA" (generated by pki-init).
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/opt/spire/pki/partner-node-ca.crt"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
