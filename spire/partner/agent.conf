# SPIRE Agent for the partner trust domain (partner.example).
agent {
    data_dir          = "/var/lib/spire/agent"
    log_level         = "INFO"
    server_address    = "spire-server-partner"
    server_port       = "8081"
    socket_path       = "/run/spire/sockets/agent.sock"
    trust_bundle_path = "/opt/spire/pki/partner-bundle.pem"
    trust_domain      = "partner.example"
}

plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/opt/spire/pki/partner-node-agent.key"
            certificate_path = "/opt/spire/pki/partner-node-agent.crt"
        }
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # Workload attestation: the agent maps the calling PID to its container and
    # derives docker:* selectors (labels, image id, ...) from the Docker API.
    # Requires pid: host, cgroup: host and the Docker socket (see compose file).
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
