# SPIRE Server - issues SPIFFE IDs / X.509-SVIDs for the demo trust domain.
server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    socket_path  = "/tmp/spire-server/private/api.sock"
    trust_domain = "demo.local"
    data_dir     = "/var/lib/spire/server/data"
    log_level    = "INFO"

    ca_ttl                 = "168h"
    default_x509_svid_ttl  = "1h"
    default_jwt_svid_ttl   = "5m"

    # SPIFFE federation: publish our bundle and keep partner.example's bundle current.
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8443
        }
        federates_with "partner.example" {
            bundle_endpoint_url = "https://spire-server-partner:8443"
            bundle_endpoint_profile "https_spiffe" {
                endpoint_spiffe_id = "spiffe://partner.example/spire/server"
            }
        }
    }

    ca_subject {
        country      = ["US"]
        organization = ["Agentic AI ICAM Demo"]
        common_name  = "SPIRE Demo CA"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/data/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/data/keys.json"
        }
    }

    # Node attestation: the SPIRE Agent proves possession of a key whose
    # certificate chains to the demo "node CA" (generated by pki-init).
    # SPIRE's signing CA is an intermediate under the enterprise PKI: Vault's pki_spire mount
    # holds the "Demo Enterprise SPIRE Issuing CA" key and signs SPIRE's CA CSR on rotation.
    # SVIDs chain to "Demo Enterprise Root CA", which is also what the trust bundle publishes.
    UpstreamAuthority "vault" {
        plugin_data {
            vault_addr      = "https://vault:8200"
            pki_mount_point = "pki_spire"
            ca_cert_path    = "/opt/spire/pki/tls/trust-anchor.pem"
            approle_auth {
                approle_auth_mount_point = "approle"
                approle_id               = "spire-server"
                approle_secret_id        = "${VAULT_APPROLE_SECRET_ID}"
            }
        }
    }

    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/opt/spire/pki/node-ca.crt"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
